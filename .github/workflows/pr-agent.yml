name: PR Agent
on:
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]
  issue_comment:
    types: [ created ]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          CONFIG__MODEL: ${{ vars.CONFIG_MODEL }}
          CONFIG__FALLBACK_MODELS: ${{ vars.CONFIG_FALLBACK_MODELS }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ vars.CONFIG_CUSTOM_MODEL_MAX_TOKENS }}
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
